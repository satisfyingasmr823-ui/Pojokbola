name: Pemeriksaan aplikasi

on:
  push:
  pull_request:

jobs:
  cek:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode
        uses: actions/checkout@v4
      - name: Siapkan Python dan Node
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Periksa index.html dan JavaScript
        run: python3 tools/check_app.py
      - name: Periksa server.py
        run: python3 -m py_compile server.py
